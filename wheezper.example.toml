# wheezper configuration — copy to ./wheezper.toml (or your config dir).
# Keys mirror CLI flags; command-line flags always win.
# Loaded from: --config PATH, ./wheezper.toml, then
#   Linux:   ~/.config/wheezper/config.toml
#   Windows: %APPDATA%\wheezper\config.toml

source = "dual"        # mic | loopback | dual | stdin
model = "base"         # tiny | base | small | medium | turbo | /path/to/model.bin
# preview-model = "auto"  # auto | same | tiny | base | ... | path (stdout preview only)
language = "en"        # or "auto" to detect per segment
# prompt = "Engineering planning for the Atlas migration"  # domain hint, up to 40 words
# with-agent = "ollama:gemma3:1b:256"  # async annotations; 256 output tokens
# knowledgebase = "knowledgebase.example.md"  # interview answers (with-agent)
# notes = "notes/work.md"
# webhook = "http://192.168.1.20:8399/hook"
# Remote meeting session (optional; needs a wheezper-server). Only committed
# lines are published, and local notes are written whether or not the network
# is up. Omit all three to stay fully local.
# session = "00000000-0000-0000-0000-000000000000"
# server = "https://meeting.example.com:50051"
# session-token = "..."     # or WHEEZPER_SESSION_TOKEN in the environment
# device = "hdmi"           # substring match, see --list-devices
# host = "pulseaudio"       # pulseaudio | wasapi | alsa | ...

# local LLM post-processing: session summary appended on stop.
# Uses an Ollama server if one is running, else llama.cpp built into
# wheezper itself (model auto-downloads, nothing to install).
ollama = true             # or "http://ollama-server:11434"
ollama-model = "gemma3:1b"  # Google's gemma3 (default) | .gguf path
# polish = true              # LLM-clean each utterance (latency!)

# partial = true            # rolling live captions (stdout only)
# print = true              # echo finished lines to stdout (default: notes only)
# rate = 16000              # stdin only
# threshold-db = -40        # silence gate
# min-silence = 0.6         # seconds of silence that close a segment
# min-segment = 0.5
# max-segment = 25
# threads = 6               # 0 = all

# --- Teams / Zoom call: both sides, labelled me/them ------------------------
# Teams follows the Windows *communications* default devices, wheezper follows
# the *console* ones, so on a laptop with a headset they are often different.
# Name both explicitly (substrings from `wheezper --list-devices`):
#   device_me   = "Microphone Array"   # a capture device: your voice
#   device_them = "Headphones"         # an OUTPUT device: Teams' audio, captured
#                                      # via WASAPI loopback / a PulseAudio monitor
# Use headphones, otherwise the mic also hears the far side and every remote
# sentence is transcribed twice (once as "them", once as "me").
# threads = 3   # leave a core for Teams; --model base keeps up, small is tighter
# no_vad = false  # keep the speech gate on for meetings (blocks typing/room noise)

