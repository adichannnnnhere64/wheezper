[package]
name = "llm-worker"
version = "0.1.0"
edition = "2024"
description = "wheezper's embedded LLM worker: llama.cpp in a subprocess (avoids ggml symbol conflicts with whisper.cpp)"
license = "MIT"

[[bin]]
name = "wheezper-llm"
path = "src/main.rs"

[dependencies]
llama-cpp-2 = "0.1.161"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
