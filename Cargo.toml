[package]
name = "wheezper"
version = "0.1.0"
edition = "2024"
description = "Live meeting/call transcription to a notepad. Single portable binary, local whisper.cpp inference."
license = "MIT"
repository = "https://github.com/adichannnnnhere64/wheezper"
readme = "README.md"

[dependencies]
whisper-rs = "0.16"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = { version = "0.18", features = ["pulseaudio"] }
ctrlc = "3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
toml = "1.2.1"

# vendored to pin whisper.cpp and force /MT (static CRT) on Windows so the
# exe runs with zero redistributable installs
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[profile.release]
lto = "thin"
strip = true
