name: release

# Publishes exactly the artifacts that CI validated: this workflow runs the
# whole ci.yml pipeline (unit tests, accuracy gate, packaged-artifact tests on
# Linux and on real Windows VMs as a standard user) and only then uploads those
# same artifacts to the GitHub Release, with SHA256 checksums.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: validate
    uses: ./.github/workflows/ci.yml

  verify-tag:
    name: tag matches Cargo.toml version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with the crate version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $version   tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "ERROR: tag v$tag does not match version $version in Cargo.toml" >&2
            exit 1
          fi

  publish:
    name: publish validated artifacts
    needs: [ci, verify-tag]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # `wheezper --update` installs a raw binary, not an archive: publish the
      # same bytes the tarball/zip carry, with one checksum list covering all of
      # them. Asset names are the updater's platform table — do not rename.
      - name: Raw binaries for self-update
        run: |
          set -euo pipefail
          mkdir -p raw-linux raw-windows
          tar xzf wheezper-linux-amd64.tar.gz -C raw-linux
          unzip -o -q wheezper-windows-x64.zip -d raw-windows
          cp raw-linux/wheezper wheezper-linux-amd64
          cp raw-windows/wheezper.exe wheezper-windows-x64.exe
          chmod +x wheezper-linux-amd64
      - name: Checksums
        run: |
          set -euo pipefail
          ls -la
          sha256sum wheezper-linux-amd64.tar.gz wheezper-windows-x64.zip \
                    wheezper-linux-amd64 wheezper-windows-x64.exe > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wheezper-linux-amd64.tar.gz
            wheezper-windows-x64.zip
            wheezper-linux-amd64
            wheezper-windows-x64.exe
            SHA256SUMS
          fail_on_unmatched_files: true
          preserve_order: true
          generate_release_notes: true
          body: |
            Validated build — these exact files passed the CI gates:

            - `cargo test --release --workspace` on Linux and Windows
            - speech-accuracy gate (>= 90% word accuracy on the committed fixture)
            - Linux artifact unpacked into a scratch directory on Ubuntu 22.04 and 24.04
            - Windows artifact unpacked and run on real Windows VMs (2022, 2025)
              as a **standard, non-administrator user** from a user-writable
              directory: no installer, no PATH changes, no redistributables

            Update in place: `wheezper --update` (reads `SHA256SUMS` and replaces
            the running binary; on Windows the swap happens as the process exits).
            The Android companion is distributed through Google Play, which
            delivers its updates; its Settings screen uses Play's in-app update
            flow.

            Verify with `sha256sum -c SHA256SUMS` (Windows: `Get-FileHash`).
