// Session lifecycle + device pairing (contract version: wheezper.v1).
syntax = "proto3";

package wheezper.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.wheezper.v1";
option java_outer_classname = "SessionProto";

// A meeting session outlives any individual connection: a laptop that drops
// offline does not end the meeting.
enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_CREATED = 1;
  SESSION_STATUS_ACTIVE = 2;
  SESSION_STATUS_COMPLETED = 3;
}

message Session {
  string id = 1; // UUID
  string title = 2;
  SessionStatus status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
  google.protobuf.Timestamp created_at = 6;
  // Number of committed transcript entries (for history previews).
  int64 transcript_count = 7;
  // Per-session AI help: connected viewers may auto-answer the far side's
  // questions as committed lines arrive. Stored so every viewer agrees about
  // whether this meeting is an interview-assist session.
  bool ai_help = 8;
  // What this meeting/interview is about, written by the user. It is carried
  // into every assistant prompt as plain context (the role, the stack, the
  // names that matter) so answers fit the session instead of the generic
  // transcript-only default. Never a place for facts about the candidate that
  // the answer may then invent — those still come from the knowledgebase.
  string ai_context = 9;
  // Extra guidance for the assistant's answer (tone, length, "correct my
  // grammar"). Applied after the built-in rules, which always win.
  string ai_instructions = 10;
}

message CreateSessionRequest {
  string title = 1;
  // Request automatic AI answers for this session (the phone drives them; the
  // server only stores the flag and answers AskQuestion calls).
  bool ai_help = 2;
  // Optional context and answer guidance; see `Session.ai_context`.
  string ai_context = 3;
  string ai_instructions = 4;
}

message UpdateSessionGuidanceRequest {
  string session_id = 1;
  // Both replace what the session holds ("" clears it). The live screen edits
  // these mid-meeting: the brief is usually written after the first question.
  string ai_context = 2;
  string ai_instructions = 3;
}

message CreateSessionResponse {
  Session session = 1;
  // Short-lived credential scoped to this session. The laptop publishes with
  // it; it grants no access to any other session.
  string session_token = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message ListSessionsRequest {
  int32 limit = 1; // 0 = server default (50)
  bool active_only = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message StartSessionRequest {
  string session_id = 1;
}

message EndSessionRequest {
  string session_id = 1;
}

message EndSessionResponse {
  Session session = 1;
}

service SessionService {
  // Requires a paired device token.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // Replace the session's AI context/guidance (device token; the phone owns
  // the brief). Returns the updated session.
  rpc UpdateSessionGuidance(UpdateSessionGuidanceRequest) returns (Session);
  rpc GetSession(GetSessionRequest) returns (Session);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc StartSession(StartSessionRequest) returns (Session);
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse);
}

message PairDeviceRequest {
  // Shared pairing code, printed by the server operator (never stored in the
  // app). Exchanged once for a short-lived device token.
  string pairing_code = 1;
  string device_name = 2;
}

message PairDeviceResponse {
  string device_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

service AuthService {
  rpc PairDevice(PairDeviceRequest) returns (PairDeviceResponse);
}
