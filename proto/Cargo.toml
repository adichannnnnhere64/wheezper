[package]
name = "wheezper-proto"
version = "0.1.0"
edition = "2024"
description = "Versioned gRPC contract shared by the wheezper client, server and Android app"
license = "MIT"

[dependencies]
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
